@if (!router.url.includes('/account/login') && !router.url.includes('/account/register')) {
  <app-header></app-header>
}

<div
  [class.p-8]="!router.url.includes('/account')"
  class="min-h-screen bg-gray-50"
  [class.ml-64]="accountService.currentUser()"
>
  <router-outlet></router-outlet>
</div>
